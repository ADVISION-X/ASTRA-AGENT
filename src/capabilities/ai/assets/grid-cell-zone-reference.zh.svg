<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980">
  <rect width="1400" height="980" fill="#f7f7f2"/>

  <text x="700" y="70" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="38" font-weight="700" fill="#1f2933">
    GrassEye 单个 gridCell 内部 cellZone 九宫格参考图
  </text>
  <text x="700" y="112" text-anchor="middle" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" fill="#4b5563">
    每个大格子内部被分成 3 x 3；实际点击点是对应小区的中心点
  </text>

  <g transform="translate(250,170)">
    <rect x="0" y="0" width="900" height="720" rx="8" fill="#ffffff" stroke="#111827" stroke-width="5"/>

    <line x1="300" y1="0" x2="300" y2="720" stroke="#111827" stroke-width="3"/>
    <line x1="600" y1="0" x2="600" y2="720" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="240" x2="900" y2="240" stroke="#111827" stroke-width="3"/>
    <line x1="0" y1="480" x2="900" y2="480" stroke="#111827" stroke-width="3"/>

    <g font-family="Arial, 'PingFang SC', sans-serif" text-anchor="middle">
      <g transform="translate(150,120)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">top_left</text>
        <text y="-15" font-size="24" fill="#374151">左上</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/6, y=1/6</text>
      </g>

      <g transform="translate(450,120)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">top_center</text>
        <text y="-15" font-size="24" fill="#374151">上中</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/2, y=1/6</text>
      </g>

      <g transform="translate(750,120)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">top_right</text>
        <text y="-15" font-size="24" fill="#374151">右上</text>
        <text y="43" font-size="18" fill="#6b7280">x=5/6, y=1/6</text>
      </g>

      <g transform="translate(150,360)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">middle_left</text>
        <text y="-15" font-size="24" fill="#374151">中左</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/6, y=1/2</text>
      </g>

      <g transform="translate(450,360)">
        <circle cx="0" cy="0" r="13" fill="#dc2626"/>
        <text y="-45" font-size="30" font-weight="700" fill="#111827">center</text>
        <text y="-15" font-size="24" fill="#374151">中心</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/2, y=1/2</text>
      </g>

      <g transform="translate(750,360)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">middle_right</text>
        <text y="-15" font-size="24" fill="#374151">中右</text>
        <text y="43" font-size="18" fill="#6b7280">x=5/6, y=1/2</text>
      </g>

      <g transform="translate(150,600)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">bottom_left</text>
        <text y="-15" font-size="24" fill="#374151">左下</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/6, y=5/6</text>
      </g>

      <g transform="translate(450,600)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">bottom_center</text>
        <text y="-15" font-size="24" fill="#374151">下中</text>
        <text y="43" font-size="18" fill="#6b7280">x=1/2, y=5/6</text>
      </g>

      <g transform="translate(750,600)">
        <circle cx="0" cy="0" r="11" fill="#d97706"/>
        <text y="-45" font-size="28" font-weight="700" fill="#111827">bottom_right</text>
        <text y="-15" font-size="24" fill="#374151">右下</text>
        <text y="43" font-size="18" fill="#6b7280">x=5/6, y=5/6</text>
      </g>
    </g>
  </g>

  <g font-family="Arial, 'PingFang SC', sans-serif" fill="#111827">
    <text x="250" y="935" font-size="22" font-weight="700">读法：</text>
    <text x="315" y="935" font-size="20">先选大格子 gridCell，例如 H7；再选大格子内部位置 cellZone，例如 middle_right。</text>
    <text x="250" y="965" font-size="20" fill="#4b5563">如果不提供 cellZone，当前调度默认使用 center，所以小按钮很容易发生点击漂移。</text>
  </g>
</svg>
