[workspace]
resolver = "2"
members = [
  "crates/host",
  "crates/browserctl",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
base64 = "0.22.1"
ed25519-dalek = "2.1.1"
hmac = "0.12.1"
libc = "0.2.175"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
